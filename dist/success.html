<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | 0Machine Workshop OS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0C12;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 107, 53, 0.2);
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    .sub {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #FF6B35;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #E85A24;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="icon" class="spinner"></div>
    <div id="title" class="title">Payment Successful!</div>
    <div id="sub" class="sub">Activating your 0Machine Pro account...</div>
    <a id="action-btn" href="/" class="btn" style="display: none;">Go to Dashboard</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');

    async function checkStatus() {
      if (!sessionId) {
        window.location.href = '/';
        return;
      }

      try {
        const verifyEndpoint = 'https://www.0machine.com/api/verify-session?session_id=' + encodeURIComponent(sessionId);
        const res = await fetch(verifyEndpoint);
        const data = await res.json();

        if (data.isPro) {
          document.getElementById('icon').style.display = 'none';
          document.getElementById('title').innerText = '🎉 Account Activated!';
          document.getElementById('sub').innerText = 'Welcome to 0Machine Pro. Redirecting to your dashboard...';
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
          return true;
        }
      } catch (err) {
        console.warn('Verification error:', err);
      }
      return false;
    }

    checkStatus();

    let attempts = 0;
    const interval = setInterval(async () => {
      attempts++;
      const success = await checkStatus();
      if (success || attempts >= 15) {
        clearInterval(interval);
        if (!success) {
          document.getElementById('icon').style.display = 'none';
          document.getElementById('title').innerText = 'Payment Received';
          document.getElementById('sub').innerText = 'Your payment was processed. Click below to enter your dashboard.';
          document.getElementById('action-btn').style.display = 'inline-block';
        }
      }
    }, 2000);
  </script>
</body>
</html>
