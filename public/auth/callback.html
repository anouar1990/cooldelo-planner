<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating... | 0Machine</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #0A0C12; color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px; padding: 40px;
      max-width: 400px; width: 90%; text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255, 107, 53, 0.2);
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #8B95A8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div class="title">Authenticating...</div>
    <div class="sub">Completing your 0Machine login</div>
  </div>

  <script>
    // Preserve query parameters (?code=...) and hash (#access_token=...) and redirect to app root
    const targetUrl = '/' + window.location.search + window.location.hash;
    window.location.href = targetUrl;
  </script>
</body>
</html>
